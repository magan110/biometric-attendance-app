name: faceattendence
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

# Camera preview and live streaming
  camera: ^0.11.0+2

# Face Detection (ML Kit)
  google_mlkit_face_detection: ^0.12.0

# TfLite for running the face recognition model
  tflite_flutter: ^0.12.1

# Image processing
  image: ^4.2.0

# Local vector database for storing face embeddings
  sqflite: ^2.3.3+1
  path: ^1.9.0      

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/